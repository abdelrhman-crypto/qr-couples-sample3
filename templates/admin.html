<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء كارت معايدة جديد 💌</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <h1 class="text-2xl font-bold text-gray-800 text-center mb-6">لوحة إنشاء الكارت 🎈</h1>
        
        <!-- يجب وجود enctype="multipart/form-data" لرفع الملفات -->
        <form action="/" method="POST" enctype="multipart/form-data" class="space-y-4">
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">اسم المستلم (To):</label>
                <input type="text" name="recipient_name" required placeholder="مثال: Love" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">اسم الراسل (From):</label>
                <input type="text" name="sender_name" required placeholder="مثال: Abdelrhman" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">رسالة الإيميل القصيرة (الظرف):</label>
                <input type="text" name="email_message" required placeholder="رسالة تظهر في الشاشة الثانية..." class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">رسالة المعايدة الرئيسية:</label>
                <textarea name="main_message" rows="4" required placeholder="اكتب النص الطويل للمعايدة هنا..." class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none"></textarea>
            </div>

            <!-- زر اختيار صورة من الجهاز -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">اختر صورة الكارت من جهازك:</label>
                <input type="file" name="photo_file" accept="image/*" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none bg-gray-50 text-sm">
            </div>

            <!-- زر اختيار ملف صوت من الجهاز -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">اختر الأغنية (MP3) من جهازك:</label>
                <input type="file" name="song_file" accept="audio/*" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none bg-gray-50 text-sm">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">لون خلفية المعايدة:</label>
                <input type="color" name="bg_color" value="#d90429" class="w-full h-12 p-1 border rounded-xl cursor-pointer">
            </div>

            <button type="submit" class="w-full bg-[#d90429] hover:bg-red-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md">
                إنشاء الكارت 🚀
            </button>
        </form>
    </div>

</body>
</html>
