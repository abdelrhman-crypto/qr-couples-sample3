<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample 3 - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-pink-50 min-h-screen py-10 px-4">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-3xl shadow-xl border border-pink-100">
        <h1 class="text-2xl font-bold text-center text-pink-600 mb-6">إنشاء كارت Sample 3 💌</h1>
        
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label class="block mb-1 text-sm font-semibold text-gray-700">اسم الراسل (From):</label>
                <input type="text" name="sender_name" placeholder="مثال: Babe" class="w-full p-3 border rounded-xl border-gray-300 focus:outline-pink-500" required>
            </div>

            <div>
                <label class="block mb-1 text-sm font-semibold text-gray-700">اسم المستلم (To):</label>
                <input type="text" name="recipient_name" placeholder="مثال: My Love" class="w-full p-3 border rounded-xl border-gray-300 focus:outline-pink-500" required>
            </div>

            <div>
                <label class="block mb-1 text-sm font-semibold text-gray-700">رسالة الـ Email الصغيرة:</label>
                <input type="text" name="email_message" value="Check out this awesome surprises for YOU!" class="w-full p-3 border rounded-xl border-gray-300 focus:outline-pink-500">
            </div>

            <div>
                <label class="block mb-1 text-sm font-semibold text-gray-700">الرسالة الرئيسية الطويلة:</label>
                <textarea name="main_message" rows="5" placeholder="اكتب رسالة عيد الميلاد هنا..." class="w-full p-3 border rounded-xl border-gray-300 focus:outline-pink-500" required></textarea>
            </div>

            <div>
                <label class="block mb-1 text-sm font-semibold text-gray-700">الصورة الشخصية:</label>
                <input type="file" name="photo" accept="image/*" class="w-full p-2 border rounded-xl bg-gray-50 border-gray-300" required>
            </div>

            <div>
                <label class="block mb-1 text-sm font-semibold text-gray-700">الأغنية (اختياري):</label>
                <input type="file" name="song" accept="audio/*" class="w-full p-2 border rounded-xl bg-gray-50 border-gray-300">
            </div>

            <button type="submit" class="w-full py-3 bg-pink-500 text-white font-bold rounded-xl shadow-lg hover:bg-pink-600 transition">إنشاء الكارت والـ QR ✨</button>
        </form>

        {% if card_url %}
        <div class="mt-8 p-6 bg-pink-50 rounded-2xl text-center border border-pink-200">
            <h2 class="text-lg font-bold text-pink-700 mb-2">تم إنشاء الكارت بنجاح! 🎉</h2>
            <p class="text-sm text-gray-600 mb-4">الرابط المباشر:</p>
            <a href="{{ card_url }}" target="_blank" class="text-blue-600 underline text-sm break-all font-mono">{{ card_url }}</a>
            
            <div class="mt-4 flex justify-center">
                <img src="{{ qr_url }}" alt="QR Code" class="w-40 h-40 border-2 border-white rounded-xl shadow">
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
