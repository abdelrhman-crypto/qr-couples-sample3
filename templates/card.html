<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You've Got Mail! 💌</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .handwriting { font-family: 'Caveat', cursive; }

        /* Banner Decoration */
        .bunting {
            background-image: radial-gradient(circle, #ffeb3b 20%, transparent 20%), radial-gradient(circle, #00bcd4 20%, transparent 20%), radial-gradient(circle, #e91e63 20%, transparent 20%);
            background-size: 15px 15px;
            background-position: 0 0, 7px 7px, 3px 3px;
        }
    </style>
</head>
<body class="bg-[#f3f3f3] min-h-screen flex items-center justify-center p-4 overflow-x-hidden">

    <!-- مشغل صوت مخفي -->
    {% if data.song_url %}
        <audio id="bgMusic" loop preload="auto" style="display: none;">
            <source src="{{ data.song_url }}" type="audio/mpeg">
        </audio>
    {% endif %}

    <!-- 1️⃣ الشاشة الأولى (الظرف والرسالة الأولى) -->
    <div id="step-1" class="text-center transition-all duration-500 max-w-sm w-full">
        <h1 class="handwriting text-4xl text-gray-800 mb-6">hey {{ data.recipient_name }}!</h1>
        
        <div onclick="openEmail()" class="cursor-pointer transition-transform hover:scale-105 active:scale-95 inline-block my-4">
            <div class="w-64 h-44 bg-[#f8a3b8] rounded-2xl relative shadow-md flex items-center justify-center border-2 border-white">
                <!-- Flap -->
                <div class="absolute top-0 w-0 h-0 border-l-[128px] border-l-transparent border-r-[128px] border-r-transparent border-t-[90px] border-t-[#f38ba8] origin-top"></div>
                <!-- Heart -->
                <div class="z-10 text-red-500 text-4xl animate-bounce">❤️</div>
            </div>
        </div>

        <p class="handwriting text-2xl text-gray-600 mt-4">you've got new emails</p>
    </div>

    <!-- 2️⃣ الشاشة الثانية (واجهة الـ Email الحمراء) -->
    <div id="step-2" class="hidden transition-all duration-500 max-w-sm w-full">
        <div class="bg-[#e60023] text-white p-6 rounded-3xl shadow-2xl relative transform -rotate-1 border-4 border-white">
            <div class="space-y-2 text-left handwriting text-2xl">
                <p><span class="font-bold">From:</span> {{ data.sender_name }}</p>
                <p><span class="font-bold">To:</span> {{ data.recipient_name }}</p>
                <div class="pt-4">
                    <p class="font-bold mb-1">Message:</p>
                    <p class="text-xl font-normal leading-snug">{{ data.email_message }}</p>
                </div>
            </div>

            <div class="mt-8 text-center">
                <button onclick="openMainCard()" class="text-xs underline text-white hover:text-gray-200 transition font-mono tracking-wider uppercase">
                    see attachment
                </button>
            </div>
        </div>
    </div>

    <!-- 3️⃣ الشاشة الثالثة (صفحة المعايدة الكبيرة الأحمر) -->
    <div id="step-3" class="hidden fixed inset-0 bg-[#d90429] z-50 overflow-y-auto p-6 text-white text-center">
        <!-- زينة أعياد الميلاد (Bunting Garland) -->
        <div class="absolute top-0 left-0 right-0 h-12 flex justify-between px-4 pt-1 opacity-90">
            <span class="text-2xl">🎉</span><span class="text-2xl">🚩</span><span class="text-2xl">✨</span><span class="text-2xl">🎈</span><span class="text-2xl">🚩</span><span class="text-2xl">🎉</span>
        </div>

        <div class="max-w-md mx-auto pt-10 space-y-6">
            
            <!-- حاوية الصورة + الطاقية والأستيكرات الأوتوماتيكية -->
            <div class="relative inline-block mt-4">
                <!-- صورة الشخص المرفوعة -->
                <div class="w-48 h-48 mx-auto rounded-full overflow-hidden border-4 border-white shadow-2xl bg-black">
                    <img src="{{ data.photo_url }}" class="w-full h-full object-cover">
                </div>

                <!-- طاقية عيد الميلاد الأوتوماتيكية (CSS Sticker) -->
                <div class="absolute -top-10 left-12 text-5xl transform -rotate-12 select-none pointer-events-none drop-shadow-md">
                    🥳
                </div>

                <!-- كيكة عيد الميلاد الأوتوماتيكية -->
                <div class="absolute -bottom-4 -right-2 text-4xl select-none pointer-events-none drop-shadow-md animate-pulse">
                    🎂
                </div>
            </div>

            <h2 class="handwriting text-4xl font-bold text-white mt-4">Happy Birthday, my love.</h2>

            <!-- النص الطويل -->
            <div class="handwriting text-2xl text-left leading-relaxed whitespace-pre-line px-2 text-gray-100">
                {{ data.main_message }}
            </div>
        </div>
    </div>

    <script>
        function playAudio() {
            const audio = document.getElementById('bgMusic');
            if (audio) {
                audio.play().catch(e => console.log(e));
            }
        }

        function openEmail() {
            playAudio();
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
        }

        function openMainCard() {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3').classList.remove('hidden');
        }

        // تشغيل الصوت عند أول تفاعل باللمس أو الكليك
        document.addEventListener('click', playAudio, { once: true });
        document.addEventListener('touchstart', playAudio, { once: true });
    </script>
</body>
</html>
